name: web-search-plus
version: "4.3.1"
description: "Multi-provider web search, URL extraction, quality reports, and opt-in research mode"
author: robbyczgw-cla
requires_env: []
optional_env:
  - SERPER_API_KEY
  - SERPBASE_API_KEY
  - BRAVE_API_KEY
  - TAVILY_API_KEY
  - EXA_API_KEY
  - QUERIT_API_KEY
  - LINKUP_API_KEY
  - FIRECRAWL_API_KEY
  - YOU_API_KEY
  - PARALLEL_API_KEY
  - SEARXNG_INSTANCE_URL
  - KEENABLE_API_KEY
  - DONSETCH_BIN
  - MONID_API_KEY
  - TINYFISH_API_KEY
provides_tools:
  - web_search_plus
  - web_extract_plus
provides_web_providers:
  - wsp
provides_hooks:
  - on_session_start
onboarding:
  setup_command: "python ~/.hermes/plugins/web-search-plus/setup.py setup"
  status_command: "python ~/.hermes/plugins/web-search-plus/setup.py status"
  fastpath_status_command: "python ~/.hermes/plugins/web-search-plus/setup.py fastpath"
  routing_status_command: "python ~/.hermes/plugins/web-search-plus/setup.py config show"
  routing_config_commands:
    fixed_provider: "python ~/.hermes/plugins/web-search-plus/setup.py config set-default you"
    auto_routing: "python ~/.hermes/plugins/web-search-plus/setup.py config set-routing on"
    priority: "python ~/.hermes/plugins/web-search-plus/setup.py config set-priority you,serper,exa,firecrawl,tavily,linkup,parallel"
    fallback: "python ~/.hermes/plugins/web-search-plus/setup.py config set-fallback serper"
    disable_provider: "python ~/.hermes/plugins/web-search-plus/setup.py config disable brave"
    block_auto_provider: "python ~/.hermes/plugins/web-search-plus/setup.py config set-auto-allow brave off"
    reset: "python ~/.hermes/plugins/web-search-plus/setup.py config reset --yes"
  config_file: "~/.hermes/plugins/config.json"
  env_override: "WEB_SEARCH_PLUS_CONFIG"
  note: "No single provider key is globally required. Add at least one search-capable provider for web_search_plus; add Linkup or another extraction-capable provider for web_extract_plus. Setup keys live in .env; routing preferences live in config.json and can choose fixed-provider mode or tuned auto-routing without relying on unreleased Hermes core plugin-CLI support. Use setup.py fastpath to inspect advisory Hermes config hints for lower-latency direct tool routing."
  recommended_env:
    - name: YOU_API_KEY
      description: "You.com — fast Routing v2 core provider"
      url: "https://api.you.com"
      secret: true
    - name: SERPER_API_KEY
      description: "Serper — reliable Google-like fallback for search/news/shopping/local"
      url: "https://serper.dev/api-key"
      secret: true
    - name: LINKUP_API_KEY
      description: "Linkup — cheap clean extraction (€5 free monthly credits)"
      url: "https://www.linkup.so"
      secret: true
config_schema:
  country: {type: str, label: "Country", description: "ISO 3166-1 alpha-2 hint. Empty leaves config.json unchanged."}
  language: {type: str, label: "Language", description: "ISO 639-1 hint. Empty leaves config.json unchanged."}
  max_results: {type: int, default: 5, label: "Max results", description: "Default result count. 0 leaves config.json unchanged."}
  auto_routing: {type: bool, label: "Auto routing", description: "Turn automatic provider routing on or off. Priority and budgets stay in config.json."}
  searxng_url: {type: str, label: "SearXNG URL", description: "SearXNG base URL. Not a secret. Empty leaves config.json unchanged."}
  serper_api_key: {type: secret, env: SERPER_API_KEY, description: "Serper API key"}
  brave_api_key: {type: secret, env: BRAVE_API_KEY, description: "Brave Search API key"}
  tavily_api_key: {type: secret, env: TAVILY_API_KEY, description: "Tavily API key"}
  you_api_key: {type: secret, env: YOU_API_KEY, description: "You.com API key"}
  linkup_api_key: {type: secret, env: LINKUP_API_KEY, description: "Linkup API key"}
  serpbase_api_key: {type: secret, env: SERPBASE_API_KEY, description: "SerpBase API key (explicit-only; enable in config.json)"}
  exa_api_key: {type: secret, env: EXA_API_KEY, description: "Exa API key"}
  querit_api_key: {type: secret, env: QUERIT_API_KEY, description: "Querit API key (explicit-only; enable in config.json)"}
  firecrawl_api_key: {type: secret, env: FIRECRAWL_API_KEY, description: "Firecrawl API key"}
  parallel_api_key: {type: secret, env: PARALLEL_API_KEY, description: "Parallel API key"}
  keenable_api_key: {type: secret, env: KEENABLE_API_KEY, description: "Keenable API key"}
  monid_api_key: {type: secret, env: MONID_API_KEY, description: "Monid API key (explicit-only; enable in config.json)"}
  tinyfish_api_key: {type: secret, env: TINYFISH_API_KEY, description: "TinyFish API key (explicit-only; enable in config.json)"}
